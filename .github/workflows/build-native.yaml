on:
  push:
    branches:
      - 'master'
    paths:
      - 'packages/splat-transform-native/source/**'
      - 'packages/splat-transform/package.json'
      - '.github/workflows/build-native.yaml'
      - '.github/build-native-linux.Dockerfile'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'packages/splat-transform-native/source/**'
      - 'packages/splat-transform/package.json'
      - '.github/workflows/build-native.yaml'
      - '.github/build-native-linux.Dockerfile'
  workflow_dispatch:
    inputs:
      force-build-image:
        description: Force a fresh rebuild of the Linux build image
        required: false
        default: false
        type: boolean

name: build native

env:
  NODE_VERSION: 24
  CMAKE_VERSION: 4.4.2
  NINJA_VERSION: 1.13.2

permissions:
  contents: read
  packages: write

jobs:
  compile-shaders:
    name: Compile shared SPIR-V shaders (Windows)
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download DXC
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dxc_2026_09_29.zip'
          $dxcRoot = Join-Path $env:RUNNER_TEMP 'aholo-dxc'
          Invoke-WebRequest 'https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip' -OutFile $archive
          $expectedHash = 'cec5e575dbf542a902eab64686fd31edc14b6d512e0735d0237fb0befec86746e8024bed21f409db5d9b86b61f0fb26470801a6fdd88f035fd0faaacbacc09f4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA512).Hash -ne $expectedHash) {
            throw 'DXC archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $dxcRoot
          "DXC_EXECUTABLE=$dxcRoot/bin/x64/dxc.exe" >> $env:GITHUB_ENV

      - name: Compile shaders
        run: cmake -P packages/splat-transform-native/source/cmake/compile-shaders.cmake

      - name: Upload shader headers
        uses: actions/upload-artifact@v7
        with:
          name: native-shader-headers
          path: packages/splat-transform-native/source/build/generated/shaders/*.h
          if-no-files-found: error

  build-linux-image:
    name: Build native Linux image (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ${{ matrix.os }}
    outputs:
      hash: ${{ steps.image.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          cache_hash="$({ printf '%s\n%s\n%s\n' "${CMAKE_VERSION}" "${NINJA_VERSION}" "${NODE_VERSION}"; cat .github/build-native-linux.Dockerfile packages/splat-transform-native/source/vcpkg-configuration.json; } | sha256sum | cut -c1-16)"
          base="ghcr.io/${repo_lc}/aholo-native-linux"
          echo "hash=${cache_hash}" >> "${GITHUB_OUTPUT}"
          echo "platform-ref=${base}:${cache_hash}-${{ matrix.arch }}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push native Linux image
        uses: docker/build-push-action@v7
        with:
          context: .github
          file: .github/build-native-linux.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          pull: ${{ inputs['force-build-image'] == true }}
          no-cache: ${{ inputs['force-build-image'] == true }}
          tags: ${{ steps.image.outputs.platform-ref }}
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            VCPKG_CACHE_KEY=${{ hashFiles('packages/splat-transform-native/source/vcpkg-configuration.json') }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/aholo-native-linux:latest
          cache-to: type=inline
          provenance: false

  publish-linux-image:
    name: Publish multi-platform Linux image
    needs: build-linux-image
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "base=ghcr.io/${repo_lc}/aholo-native-linux" >> "${GITHUB_OUTPUT}"
          echo "hash=${{ needs.build-linux-image.outputs.hash }}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform Linux manifest
        shell: bash
        run: |
          base="${{ steps.image.outputs.base }}"
          cache_hash="${{ steps.image.outputs.hash }}"
          manifest_tags=(--tag "${base}:${cache_hash}")

          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            manifest_tags+=(--tag "${base}:latest")
          fi

          docker buildx imagetools create "${manifest_tags[@]}" \
            "${base}:${cache_hash}-amd64" \
            "${base}:${cache_hash}-arm64"
          docker buildx imagetools inspect "${base}:${cache_hash}"

  build-splat-transform-native:
    name: Build splat-transform native (${{ matrix.target }})
    needs:
      - compile-shaders
      - build-linux-image
      - publish-linux-image
    if: ${{ always() && needs.compile-shaders.result == 'success' && ((needs.build-linux-image.result == 'success' && needs.publish-linux-image.result == 'success') || (needs.build-linux-image.result == 'skipped' && needs.publish-linux-image.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            preset: x64-windows-static
            executable: splat-transform.exe
            os: windows-2025-vs2026
            shell: pwsh
          - target: win32-arm64-msvc
            preset: arm64-windows-static
            executable: splat-transform.exe
            os: windows-11-vs2026-arm
            shell: pwsh
          - target: linux-x64-gnu
            preset: x64-linux
            executable: splat-transform
            os: ubuntu-26.04
            shell: bash
            arch: amd64
          - target: linux-arm64-gnu
            preset: arm64-linux
            executable: splat-transform
            os: ubuntu-26.04-arm
            shell: bash
            arch: arm64
          - target: darwin-arm64
            preset: arm64-osx
            executable: splat-transform
            os: macos-26
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download shader headers
        uses: actions/download-artifact@v8
        with:
          name: native-shader-headers
          path: packages/splat-transform-native/source/build/generated/shaders

      - name: Login to GitHub Container Registry
        if: startsWith(matrix.os, 'ubuntu')
        continue-on-error: ${{ needs.build-linux-image.result == 'skipped' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/setup-buildx-action@v4

      - name: Build and load native Linux image
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/build-push-action@v7
        with:
          context: .github
          file: .github/build-native-linux.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: aholo-native-linux:22.04
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
            VCPKG_CACHE_KEY=${{ hashFiles('packages/splat-transform-native/source/vcpkg-configuration.json') }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/aholo-native-linux:latest
          provenance: false

      - name: Validate Linux build image
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          docker run --rm aholo-native-linux:22.04 bash -ec \
            'cmake --version; cc --version; c++ --version; ninja --version; node --version; fnm --version; vcpkg version'

      - name: Setup env (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ninja nasm
          cmake --version
          clang --version
          ninja --version
          nasm --version

      - name: Setup vcpkg (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "aholo-vcpkg"
          git clone https://github.com/microsoft/vcpkg "$vcpkgRoot"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to clone vcpkg' }
          & "$vcpkgRoot/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'Failed to bootstrap vcpkg' }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Setup vcpkg (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          vcpkg_root="${RUNNER_TEMP}/aholo-vcpkg"
          git clone https://github.com/microsoft/vcpkg "${vcpkg_root}"
          "${vcpkg_root}/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"

      - name: Build splat-transform native (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work/packages/splat-transform-native/source \
            aholo-native-linux:22.04 \
            bash -lc 'cmake --workflow --preset ${{ matrix.preset }}'

      - name: Build splat-transform native
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: |
          cd packages/splat-transform-native/source
          cmake --workflow --preset ${{ matrix.preset }}

      - name: Print native build failure logs
        if: failure()
        shell: pwsh
        run: |
          $manifestLog = 'packages/splat-transform-native/source/build/vcpkg-manifest-install.log'
          if (Test-Path -LiteralPath $manifestLog) {
            Get-Content -LiteralPath $manifestLog -Tail 150
          }

      - name: Validate executable (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          $binary = './packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.exe'
          if (!(Test-Path -LiteralPath $binary)) { throw 'Missing splat-transform.exe' }
          '{"version":1,"tasks":[]}' | & $binary -
          if ($LASTEXITCODE -ne 0) { throw 'Pipeline smoke test failed' }

      - name: Validate executable (Unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          binary='./packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform'
          test -x "$binary"
          printf '%s' '{"version":1,"tasks":[]}' | "$binary" -

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: splat-transform-${{ matrix.target }}
          path: |
            packages/splat-transform-native/splat-transform-${{ matrix.target }}/${{ matrix.executable }}
            packages/splat-transform-native/splat-transform-${{ matrix.target }}/THIRD_PARTY_LICENSES.txt
          if-no-files-found: error
