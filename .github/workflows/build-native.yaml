on:
  push:
    branches:
      - 'master'
    paths:
      - 'packages/splat-transform-native/source/**'
      - '.github/workflows/build-native.yaml'
      - '.github/build-native-linux.Dockerfile'
  pull_request:
    branches:
      - 'master'
    paths:
      - 'packages/splat-transform-native/source/**'
      - '.github/workflows/build-native.yaml'
      - '.github/build-native-linux.Dockerfile'
  workflow_dispatch:
    inputs:
      force-build-image:
        description: Force a fresh rebuild of the Linux build image
        required: false
        default: false
        type: boolean

name: build native

env:
  NODE_VERSION: 24
  CMAKE_VERSION: 4.4.2
  NINJA_VERSION: 1.13.2

permissions:
  contents: read
  packages: write

jobs:
  build-linux-image:
    name: Build native Linux image (${{ matrix.arch }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ${{ matrix.os }}
    outputs:
      hash: ${{ steps.image.outputs.hash }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          cache_hash="$({ printf '%s\n%s\n%s\n' "${CMAKE_VERSION}" "${NINJA_VERSION}" "${NODE_VERSION}"; cat .github/build-native-linux.Dockerfile; } | sha256sum | cut -c1-16)"
          base="ghcr.io/${repo_lc}/aholo-native-linux"
          echo "hash=${cache_hash}" >> "${GITHUB_OUTPUT}"
          echo "platform-ref=${base}:${cache_hash}-${{ matrix.arch }}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push native Linux image
        uses: docker/build-push-action@v7
        with:
          context: .github
          file: .github/build-native-linux.Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          pull: ${{ inputs['force-build-image'] == true }}
          no-cache: ${{ inputs['force-build-image'] == true }}
          tags: ${{ steps.image.outputs.platform-ref }}
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/aholo-native-linux:latest
          cache-to: type=inline
          provenance: false

  publish-linux-image:
    name: Publish multi-platform Linux image
    needs: build-linux-image
    runs-on: ubuntu-26.04
    steps:
      - name: Resolve Linux image metadata
        id: image
        shell: bash
        run: |
          repo_lc="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "base=ghcr.io/${repo_lc}/aholo-native-linux" >> "${GITHUB_OUTPUT}"
          echo "hash=${{ needs.build-linux-image.outputs.hash }}" >> "${GITHUB_OUTPUT}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform Linux manifest
        shell: bash
        run: |
          base="${{ steps.image.outputs.base }}"
          cache_hash="${{ steps.image.outputs.hash }}"
          manifest_tags=(--tag "${base}:${cache_hash}")

          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            manifest_tags+=(--tag "${base}:latest")
          fi

          docker buildx imagetools create "${manifest_tags[@]}" \
            "${base}:${cache_hash}-amd64" \
            "${base}:${cache_hash}-arm64"
          docker buildx imagetools inspect "${base}:${cache_hash}"

  build-splat-transform-native:
    name: Build splat-transform native (${{ matrix.target }})
    needs:
      - build-linux-image
      - publish-linux-image
    if: ${{ always() && ((needs.build-linux-image.result == 'success' && needs.publish-linux-image.result == 'success') || (needs.build-linux-image.result == 'skipped' && needs.publish-linux-image.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64-msvc
            native-script: build:native:win32-x64
            os: windows-2025-vs2026
            shell: pwsh
          - target: win32-arm64-msvc
            native-script: build:native:win32-arm64
            os: windows-11-vs2026-arm
            shell: pwsh
          - target: linux-x64-gnu
            native-script: build:native:linux-x64-gnu
            os: ubuntu-26.04
            shell: bash
            arch: amd64
          - target: linux-arm64-gnu
            native-script: build:native:linux-arm64-gnu
            os: ubuntu-26.04-arm
            shell: bash
            arch: arm64
          - target: darwin-arm64
            native-script: build:native:darwin-arm64
            os: macos-26
            shell: bash
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Login to GitHub Container Registry
        if: startsWith(matrix.os, 'ubuntu')
        continue-on-error: ${{ needs.build-linux-image.result == 'skipped' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/setup-buildx-action@v4

      - name: Build and load native Linux image
        if: startsWith(matrix.os, 'ubuntu')
        uses: docker/build-push-action@v7
        with:
          context: .github
          file: .github/build-native-linux.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: aholo-native-linux:22.04
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            NINJA_VERSION=${{ env.NINJA_VERSION }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/aholo-native-linux:latest
          provenance: false

      - name: Validate Linux build image
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          docker run --rm aholo-native-linux:22.04 bash -lc \
            'cmake --version; cc --version; c++ --version; ninja --version; node --version; fnm --version; vcpkg version'

      - name: Setup env (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install ninja nasm
          cmake --version
          clang --version
          ninja --version

      - name: Setup vcpkg (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          if ($env:VCPKG_INSTALLATION_ROOT -and (Test-Path $env:VCPKG_INSTALLATION_ROOT)) {
            $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          } else {
            $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
            git clone https://github.com/microsoft/vcpkg $vcpkgRoot
            & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          }
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Setup vcpkg (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          if [ -n "${VCPKG_INSTALLATION_ROOT:-}" ] && [ -d "${VCPKG_INSTALLATION_ROOT}" ]; then
            vcpkg_root="${VCPKG_INSTALLATION_ROOT}"
          else
            vcpkg_root="${RUNNER_TEMP}/vcpkg"
            git clone https://github.com/microsoft/vcpkg "${vcpkg_root}"
            "${vcpkg_root}/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=${vcpkg_root}" >> "${GITHUB_ENV}"

      - name: Build splat-transform native (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -e AHOLO_SKIP_SUBMODULE_UPDATE=1 \
            aholo-native-linux:22.04 \
            bash -lc 'corepack enable && corepack install && pnpm install && pnpm --dir packages/splat-transform-native/source run ${{ matrix.native-script }}'

      - name: Build splat-transform native
        if: ${{ !startsWith(matrix.os, 'ubuntu') }}
        run: |
          corepack enable
          corepack install
          pnpm install
          pnpm --dir packages/splat-transform-native/source run ${{ matrix.native-script }}

      - name: Validate native package (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          if (!(Test-Path ./packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.node)) {
            throw "Missing splat-transform.node"
          }
          node -e "require('./packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.node'); console.log('native require ok')"

      - name: Validate native package (Unix)
        if: ${{ !startsWith(matrix.os, 'windows') }}
        run: |
          test -f ./packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.node
          node -e "require('./packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.node'); console.log('native require ok')"

      - name: Upload native package
        uses: actions/upload-artifact@v7
        with:
          name: splat-transform-${{ matrix.target }}
          path: packages/splat-transform-native/splat-transform-${{ matrix.target }}/splat-transform.node
          if-no-files-found: error
