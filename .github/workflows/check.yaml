on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'

name: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          npm install npm -g
          npm install corepack -g
          corepack enable
          corepack install

          pnpm install
          pnpm --filter @manycore/aholo-splat-transform run build
          pnpm check
